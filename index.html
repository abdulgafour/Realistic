<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>abdul gafour</title>
  <meta name="description" content="abdul gafour — computer science student & developer">
  <meta name="theme-color" content="#e6c875">
  <meta name="author" content="abdul gafour">
  <meta property="og:title" content="abdul gafour">
  <meta property="og:type" content="website">

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --accent: #e6c875;
      --accent-soft: rgba(230, 200, 117, 0.4);
      --accent-glow: rgba(230, 200, 117, 0.15);
      --bg: #0a0907;
      --text: #b5ad9c;
      --dim: #5a5448;
      --border: rgba(230, 200, 117, 0.1);
    }

    html, body { height: 100%; overflow: hidden; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'JetBrains Mono', 'Fira Code', 'SF Mono', 'Menlo', 'Consolas', 'Courier New', monospace;
      font-size: 14px;
      line-height: 1.5;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
    }

    /* === Ambient background layers === */
    .ambient-container {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
    }

    .ambient-container::before {
      content: '';
      position: absolute;
      inset: 0;
      background:
        radial-gradient(ellipse at 50% 40%, var(--accent-glow) 0%, transparent 60%),
        radial-gradient(ellipse at 15% 85%, rgba(230, 200, 117, 0.04) 0%, transparent 50%),
        radial-gradient(ellipse at 85% 15%, rgba(230, 200, 117, 0.03) 0%, transparent 40%);
    }

    .ambient-container::after {
      content: '';
      position: absolute;
      inset: 0;
      background-image: repeating-linear-gradient(
        0deg,
        transparent 0,
        transparent 2px,
        rgba(230, 200, 117, 0.02) 2px,
        rgba(230, 200, 117, 0.02) 3px
      );
      opacity: 0.7;
      animation: scanlines 12s linear infinite;
    }

    @keyframes scanlines {
      0% { transform: translateY(0); }
      100% { transform: translateY(3px); }
    }

    body::before {
      content: '';
      position: fixed;
      inset: 0;
      box-shadow: inset 0 0 220px rgba(0, 0, 0, 0.85);
      pointer-events: none;
      z-index: 1;
    }

    /* Floating particles */
    .particle {
      position: fixed;
      width: 2px;
      height: 2px;
      background: var(--accent);
      border-radius: 50%;
      pointer-events: none;
      z-index: 1;
      box-shadow: 0 0 4px var(--accent);
      animation: drift linear infinite;
    }

    @keyframes drift {
      from { transform: translateY(100vh) translateX(0); opacity: 0; }
      10% { opacity: 0.4; }
      90% { opacity: 0.4; }
      to { transform: translateY(-10vh) translateX(20px); opacity: 0; }
    }

    /* === Navigation === */
    .controls {
      position: fixed;
      top: 2rem;
      left: 50%;
      transform: translateX(-50%);
      z-index: 10;
    }

    #nav-buttons {
      display: flex;
      gap: 0.4rem;
      flex-wrap: wrap;
      justify-content: center;
      align-items: center;
    }

    .nav-btn {
      background: none;
      border: none;
      color: var(--dim);
      font-family: inherit;
      font-size: 0.8rem;
      cursor: pointer;
      padding: 0.4rem 0.6rem;
      letter-spacing: 0.05em;
      transition: color 0.25s ease, text-shadow 0.25s ease;
    }

    .nav-btn:hover { color: var(--text); }

    .nav-btn.active {
      color: var(--accent);
      text-shadow: 0 0 8px var(--accent-glow);
    }

    .nav-btn::before { content: '['; opacity: 0.5; margin-right: 0.3rem; }
    .nav-btn::after  { content: ']'; opacity: 0.5; margin-left: 0.3rem; }

    /* === Main content === */
    main {
      position: relative;
      z-index: 5;
      padding: 5rem 1.5rem 4rem;
      max-width: 720px;
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1.8rem;
    }

    .morph-section {
      color: var(--accent);
      font-size: 0.75rem;
      line-height: 1.2;
      white-space: pre;
      text-align: center;
      filter: drop-shadow(0 0 12px rgba(230, 200, 117, 0.25));
      letter-spacing: 0.02em;
      min-height: 110px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .body-section {
      width: 100%;
      max-width: 520px;
      text-align: center;
      transition: opacity 0.35s ease, transform 0.35s ease;
    }

    .body-section.fading {
      opacity: 0;
      transform: translateY(8px);
    }

    .tagline {
      color: var(--dim);
      font-size: 0.85rem;
      letter-spacing: 0.1em;
      margin-bottom: 1.2rem;
    }

    .tagline span { color: var(--accent); }

    .body-section p {
      color: var(--text);
      margin-bottom: 0.7rem;
      font-size: 0.9rem;
    }

    .meta-grid {
      display: inline-grid;
      grid-template-columns: auto auto;
      gap: 0.4rem 1.2rem;
      margin-top: 1.2rem;
      font-size: 0.85rem;
      text-align: left;
    }

    .meta-grid .key { color: var(--dim); }
    .meta-grid .key::before { content: '> '; opacity: 0.6; }
    .meta-grid .val { color: var(--text); }

    .links-list {
      list-style: none;
      display: inline-flex;
      flex-direction: column;
      gap: 0.6rem;
      margin-top: 0.5rem;
      font-size: 0.9rem;
      text-align: left;
    }

    .links-list li {
      display: grid;
      grid-template-columns: 90px auto;
      gap: 0.8rem;
      align-items: baseline;
    }

    .links-list .key { color: var(--dim); }
    .links-list .key::before { content: '· '; }

    .links-list a {
      color: var(--accent);
      text-decoration: none;
      border-bottom: 1px dashed transparent;
      transition: border-color 0.2s ease, background 0.2s ease;
    }

    .links-list a:hover {
      border-bottom-color: var(--accent);
    }

    .pgp-block {
      background: rgba(230, 200, 117, 0.03);
      border: 1px solid var(--border);
      padding: 1rem;
      font-size: 0.7rem;
      text-align: left;
      white-space: pre-wrap;
      word-break: break-all;
      color: var(--accent-soft);
      margin-top: 1rem;
      max-height: 200px;
      overflow-y: auto;
      font-family: inherit;
    }

    .footer-line {
      position: fixed;
      bottom: 1rem;
      left: 50%;
      transform: translateX(-50%);
      color: var(--dim);
      font-size: 0.7rem;
      letter-spacing: 0.1em;
      z-index: 5;
      opacity: 0.65;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .footer-line::before { content: '~/'; color: var(--accent); opacity: 0.7; }

    .pulse {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--accent);
      box-shadow: 0 0 6px var(--accent);
      animation: pulse 2s ease-in-out infinite;
      margin-left: 0.3rem;
    }

    @keyframes pulse {
      0%, 100% { opacity: 0.4; transform: scale(1); }
      50% { opacity: 1; transform: scale(1.3); }
    }

    /* Mobile */
    @media (max-width: 600px) {
      .morph-section { font-size: 0.5rem; }
      main { padding: 5rem 1rem 4rem; }
      #nav-buttons { gap: 0.1rem; }
      .nav-btn { font-size: 0.7rem; padding: 0.3rem 0.4rem; }
      .links-list li { grid-template-columns: 70px auto; gap: 0.5rem; }
    }
  </style>
</head>
<body>
  <div class="ambient-container" aria-hidden="true"></div>

  <nav class="controls">
    <div id="nav-buttons" aria-label="Primary navigation"></div>
  </nav>

  <main>
    <pre class="morph-section" aria-live="polite"></pre>
    <div class="body-section" id="body"></div>
  </main>

  <div class="footer-line">.session<span class="pulse"></span></div>

  <script>
    // ====================== ASCII art per section ======================
    const ascii = {
      home: ` █████╗ ██████╗ ██████╗ ██╗   ██╗██╗     
██╔══██╗██╔══██╗██╔══██╗██║   ██║██║     
███████║██████╔╝██║  ██║██║   ██║██║     
██╔══██║██╔══██╗██║  ██║██║   ██║██║     
██║  ██║██████╔╝██████╔╝╚██████╔╝███████╗
╚═╝  ╚═╝╚═════╝ ╚═════╝  ╚═════╝ ╚══════╝`,

      about: `▄▀█ █▄▄ █▀█ █░█ ▀█▀
█▀█ █▄█ █▄█ █▄█ ░█░`,

      links: `█░░ █ █▄░█ █▄▀ █▀
█▄▄ █ █░▀█ █░█ ▄█`,

      pgp:   `█▀█ █▀▀ █▀█
█▀▀ █▄█ █▀▀`
    };

    // ====================== Section body content ======================
    const bodies = {
      home: `
        <p class="tagline">/ Computer Science <span>//</span> Developer /</p>
        <p>building reliable software, one algorithm at a time.</p>
      `,
      about: `
        <p>cs student focused on the parts of programming that get harder the more you understand them — algorithm design, software architecture, and quality assurance.</p>
        <div class="meta-grid">
          <span class="key">languages</span><span class="val">c++ · python · java</span>
          <span class="key">core</span><span class="val">algorithms · data structures · oop</span>
          <span class="key">eng</span><span class="val">design patterns · testing · qa</span>
          <span class="key">tools</span><span class="val">git · unix · matlab</span>
        </div>
      `,
      links: `
        <ul class="links-list">
          <li><span class="key">github</span><a href="https://github.com/abdulgafour" target="_blank" rel="noopener noreferrer">abdulgafour</a></li>
          <li><span class="key">email</span><a href="mailto:[email protected]">[email protected]</a></li>
          <li><span class="key">linkedin</span><a href="#" target="_blank" rel="noopener noreferrer">— add url —</a></li>
        </ul>
      `,
      pgp: `
        <p style="font-size: 0.8rem; color: var(--dim); margin-bottom: 0.5rem;">paste your public key below, or remove this section.</p>
        <pre class="pgp-block">-----BEGIN PGP PUBLIC KEY BLOCK-----

[your public key here]

-----END PGP PUBLIC KEY BLOCK-----</pre>
      `
    };

    // ====================== Nav setup ======================
    const navContainer = document.getElementById('nav-buttons');
    const morphEl = document.querySelector('.morph-section');
    const bodyEl = document.getElementById('body');
    const sections = ['home', 'about', 'links', 'pgp'];
    let current = 'home';
    let morphTimer = null;

    sections.forEach(name => {
      const btn = document.createElement('button');
      btn.className = 'nav-btn' + (name === 'home' ? ' active' : '');
      btn.textContent = name;
      btn.dataset.section = name;
      btn.addEventListener('click', () => switchTo(name));
      navContainer.appendChild(btn);
    });

    function switchTo(name) {
      if (name === current) return;
      current = name;
      document.querySelectorAll('.nav-btn').forEach(b => {
        b.classList.toggle('active', b.dataset.section === name);
      });
      bodyEl.classList.add('fading');
      setTimeout(() => {
        morphTo(ascii[name]);
        bodyEl.innerHTML = bodies[name];
        bodyEl.classList.remove('fading');
      }, 320);
    }

    // ====================== Morph animation ======================
    const charset = 'abcdefghijklmnopqrstuvwxyz0123456789!@#$%^&*<>?/\\|~+=';
    const blockPool = '█▄▀▌▐▒░▓';

    function morphTo(target) {
      clearInterval(morphTimer);
      const len = target.length;
      const totalFrames = 22;
      let frame = 0;

      morphTimer = setInterval(() => {
        frame++;
        const progress = frame / totalFrames;
        let out = '';

        for (let i = 0; i < len; i++) {
          const ch = target[i];
          if (ch === '\n' || ch === ' ') { out += ch; continue; }

          const charProgress = i / len;
          const noise = Math.random() * 0.15;

          if (progress >= charProgress + noise) {
            out += ch;
          } else if (/[█▄▀▌▐▒░▓╗╔╝╚║═╠╣╦╩╬]/.test(ch)) {
            out += blockPool[Math.floor(Math.random() * blockPool.length)];
          } else {
            out += charset[Math.floor(Math.random() * charset.length)];
          }
        }

        morphEl.textContent = out;
        if (frame >= totalFrames) {
          clearInterval(morphTimer);
          morphEl.textContent = target;
        }
      }, 40);
    }

    // ====================== Floating particles ======================
    function spawnParticle() {
      const p = document.createElement('div');
      p.className = 'particle';
      p.style.left = Math.random() * 100 + 'vw';
      p.style.animationDuration = (8 + Math.random() * 12) + 's';
      p.style.opacity = String(0.2 + Math.random() * 0.4);
      document.body.appendChild(p);
      setTimeout(() => p.remove(), 22000);
    }

    setInterval(spawnParticle, 800);
    for (let i = 0; i < 6; i++) setTimeout(spawnParticle, i * 400);

    // ====================== Initial render ======================
    morphTo(ascii.home);
    bodyEl.innerHTML = bodies.home;

    // ====================== Keyboard navigation ======================
    document.addEventListener('keydown', (e) => {
      const idx = sections.indexOf(current);
      if (e.key === 'ArrowRight' || e.key === 'ArrowDown') {
        switchTo(sections[(idx + 1) % sections.length]);
      } else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') {
        switchTo(sections[(idx - 1 + sections.length) % sections.length]);
      }
    });
  </script>
</body>
</html>
