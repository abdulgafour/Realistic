    * { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --accent: #e6c875;
      --accent-soft: rgba(230, 200, 117, 0.4);
      --accent-glow: rgba(230, 200, 117, 0.15);
      --bg: #0a0907;
      --text: #b5ad9c;
      --dim: #5a5448;
      --border: rgba(230, 200, 117, 0.1);
    }

    html, body { height: 100%; overflow: hidden; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'JetBrains Mono', 'Fira Code', 'SF Mono', 'Menlo', 'Consolas', 'Courier New', monospace;
      font-size: 14px;
      line-height: 1.5;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
    }

    /* === Ambient background layers === */
    .ambient-container {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
    }

    .ambient-container::before {
      content: '';
      position: absolute;
      inset: 0;
      background:
        radial-gradient(ellipse at 50% 40%, var(--accent-glow) 0%, transparent 60%),
        radial-gradient(ellipse at 15% 85%, rgba(230, 200, 117, 0.04) 0%, transparent 50%),
        radial-gradient(ellipse at 85% 15%, rgba(230, 200, 117, 0.03) 0%, transparent 40%);
    }

    .ambient-container::after {
      content: '';
      position: absolute;
      inset: 0;
      background-image: repeating-linear-gradient(
        0deg,
        transparent 0,
        transparent 2px,
        rgba(230, 200, 117, 0.02) 2px,
        rgba(230, 200, 117, 0.02) 3px
      );
      opacity: 0.7;
      animation: scanlines 12s linear infinite;
    }

    @keyframes scanlines {
      0% { transform: translateY(0); }
      100% { transform: translateY(3px); }
    }

    body::before {
      content: '';
      position: fixed;
      inset: 0;
      box-shadow: inset 0 0 220px rgba(0, 0, 0, 0.85);
      pointer-events: none;
      z-index: 1;
    }

    /* Floating particles */
    .particle {
      position: fixed;
      width: 2px;
      height: 2px;
      background: var(--accent);
      border-radius: 50%;
      pointer-events: none;
      z-index: 1;
      box-shadow: 0 0 4px var(--accent);
      animation: drift linear infinite;
    }

    @keyframes drift {
      from { transform: translateY(100vh) translateX(0); opacity: 0; }
      10% { opacity: 0.4; }
      90% { opacity: 0.4; }
      to { transform: translateY(-10vh) translateX(20px); opacity: 0; }
    }

    /* === Navigation === */
    .controls {
      position: fixed;
      top: 2rem;
      left: 50%;
      transform: translateX(-50%);
      z-index: 10;
    }

    #nav-buttons {
      display: flex;
      gap: 0.4rem;
      flex-wrap: wrap;
      justify-content: center;
      align-items: center;
    }

    .nav-btn {
      background: none;
      border: none;
      color: var(--dim);
      font-family: inherit;
      font-size: 0.8rem;
      cursor: pointer;
      padding: 0.4rem 0.6rem;
      letter-spacing: 0.05em;
      transition: color 0.25s ease, text-shadow 0.25s ease;
    }

    .nav-btn:hover { color: var(--text); }

    .nav-btn.active {
      color: var(--accent);
      text-shadow: 0 0 8px var(--accent-glow);
    }

    .nav-btn::before { content: '['; opacity: 0.5; margin-right: 0.3rem; }
    .nav-btn::after  { content: ']'; opacity: 0.5; margin-left: 0.3rem; }

    /* === Main content === */
    main {
      position: relative;
      z-index: 5;
      padding: 5rem 1.5rem 4rem;
      max-width: 720px;
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1.8rem;
    }

    .morph-section {
      color: var(--accent);
      font-size: 0.75rem;
      line-height: 1.2;
      white-space: pre;
      text-align: center;
      filter: drop-shadow(0 0 12px rgba(230, 200, 117, 0.25));
      letter-spacing: 0.02em;
      min-height: 110px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .body-section {
      width: 100%;
      max-width: 520px;
      text-align: center;
      transition: opacity 0.35s ease, transform 0.35s ease;
    }

    .body-section.fading {
      opacity: 0;
      transform: translateY(8px);
    }

    .tagline {
      color: var(--dim);
      font-size: 0.85rem;
      letter-spacing: 0.1em;
      margin-bottom: 1.2rem;
    }

    .tagline span { color: var(--accent); }

    .body-section p {
      color: var(--text);
      margin-bottom: 0.7rem;
      font-size: 0.9rem;
    }

    .meta-grid {
      display: inline-grid;
      grid-template-columns: auto auto;
      gap: 0.4rem 1.2rem;
      margin-top: 1.2rem;
      font-size: 0.85rem;
      text-align: left;
    }

    .meta-grid .key { color: var(--dim); }
    .meta-grid .key::before { content: '> '; opacity: 0.6; }
    .meta-grid .val { color: var(--text); }

    .links-list {
      list-style: none;
      display: inline-flex;
      flex-direction: column;
      gap: 0.6rem;
      margin-top: 0.5rem;
      font-size: 0.9rem;
      text-align: left;

      gap: 0.8rem;
      align-items: baseline;

      text-decoration: none;

      transition: border-color 0.2s ease, background 0.2s ease;
    }

      border-bottom-color: var(--accent);
    }

    .pgp-block {

      border: 1px solid var(--border);

      font-size: 0.7rem;
      text-align: left;

      color: var(--accent-soft);
      margin-top: 1rem;
      max-height: 200px;
      overflow-y: auto;
      font-family: inherit;
    }

    /* === Section command label (e.g. $ cat about.txt) === */
    .cmd-label {
      color: var(--dim);
      font-size: 0.78rem;
      margin-bottom: 1rem;
      text-align: left;
      letter-spacing: 0.02em;
    }

    /* === Section content base === */

      text-align: left;

      margin-bottom: 0.7rem;
      line-height: 1.6;

    /* === Skills config === */

      text-align: left;
      display: flex;
      flex-direction: column;
      gap: 0.35rem;
    }
    .skill-row {
      display: grid;
      grid-template-columns: 100px auto;
      gap: 0.8rem;
      align-items: baseline;
    }
    .skill-key {
      color: var(--accent);
      opacity: 0.85;
      font-size: 0.78rem;
    }
    .skill-val { color: var(--text); }

    /* === Project entries === */
    .projects-list {
      display: flex;
      flex-direction: column;
      gap: 0.9rem;
      text-align: left;
    }
    .project-entry {
      border-left: 2px solid var(--border);
      padding: 0.4rem 0 0.4rem 0.9rem;
      transition: border-left-color 0.25s ease, transform 0.25s ease;
    }
    .project-entry:hover {
      border-left-color: var(--accent);

    }
    .project-header {
      display: flex;
      align-items: baseline;
      gap: 0.7rem;
      margin-bottom: 0.15rem;
    }
    .proj-num {
      color: var(--dim);
      font-size: 0.75rem;
      font-feature-settings: "tnum";

    .proj-num::before { content: '['; opacity: 0.6; }
    .proj-num::after  { content: ']'; opacity: 0.6; }
    .proj-name {
      color: var(--accent);
      font-size: 0.92rem;
    }
    .proj-tags {
      color: var(--dim);
      font-size: 0.72rem;
      margin-bottom: 0.3rem;
      letter-spacing: 0.02em;
    }
    .proj-blurb {
      color: var(--text);
      font-size: 0.83rem;
      line-height: 1.4;
    }
    .proj-detail {
      color: var(--dim);
      font-size: 0.76rem;
      margin-top: 0.25rem;
      line-height: 1.4;
    }
    .proj-detail::before { content: '→ '; opacity: 0.7; }

    /* === Scrollable body section for long content === */
    .body-section {
      max-height: 55vh;
      overflow-y: auto;
      padding-right: 0.4rem;
    }
    .body-section::-webkit-scrollbar { width: 3px; }
    .body-section::-webkit-scrollbar-track { background: transparent; }
    .body-section::-webkit-scrollbar-thumb {
      background: var(--border);
      border-radius: 2px;
    }
    .body-section::-webkit-scrollbar-thumb:hover {
      background: var(--accent-soft);
    }

    /* === Static text in links list (non-link values) === */
    .val-text { color: var(--text); }

    .footer-line {
      position: fixed;
      bottom: 1rem;
      left: 50%;
      transform: translateX(-50%);
      color: var(--dim);
      font-size: 0.7rem;
      letter-spacing: 0.1em;
      z-index: 5;
      opacity: 0.65;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .footer-line::before { content: '~/'; color: var(--accent); opacity: 0.7; }

    .pulse {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--accent);
      box-shadow: 0 0 6px var(--accent);
      animation: pulse 2s ease-in-out infinite;
      margin-left: 0.3rem;
    }

    @keyframes pulse {
      0%, 100% { opacity: 0.4; transform: scale(1); }
      50% { opacity: 1; transform: scale(1.3); }
    }

    /* Mobile */
    @media (max-width: 600px) {
      .morph-section { font-size: 0.5rem; }
      main { padding: 5rem 1rem 4rem; }
      #nav-buttons { gap: 0.1rem; }
      .nav-btn { font-size: 0.7rem; padding: 0.3rem 0.4rem; }
      .links-list li { grid-template-columns: 70px auto; gap: 0.5rem; }
    }
  </style>
</head>

    // ====================== Nav setup ======================

      btn.textContent = name;
      btn.dataset.section = name;
      btn.addEventListener('click', () => switchTo(name));
      navContainer.appendChild(btn);
    });

    function switchTo(name) {
      if (name === current) return;
      current = name;
      document.querySelectorAll('.nav-btn').forEach(b => {
        b.classList.toggle('active', b.dataset.section === name);
      });
      bodyEl.classList.add('fading');
      setTimeout(() => {
        morphTo(ascii[name]);
        bodyEl.innerHTML = bodies[name];
        bodyEl.classList.remove('fading');
        if (name === 'home') startHomeCycle();
        else stopHomeCycle();
      }, 320);
    }

    // ====================== Home name cycling ======================
    const homeVariants = ['home', 'gaffy'];
    let homeIdx = 0;
    let homeCycleTimer = null;

    function startHomeCycle() {
      stopHomeCycle();
      homeIdx = 0;
      homeCycleTimer = setInterval(() => {
        homeIdx = (homeIdx + 1) % homeVariants.length;
        morphTo(ascii[homeVariants[homeIdx]]);
      }, 6000);
    }

    function stopHomeCycle() {
      if (homeCycleTimer) {
        clearInterval(homeCycleTimer);
        homeCycleTimer = null;
      }
    }

    // ====================== Morph animation ======================
    const charset = 'abcdefghijklmnopqrstuvwxyz0123456789!@#$%^&*<>?/\\|~+=';
    const blockPool = '█▄▀▌▐▒░▓';

    function morphTo(target) {
      clearInterval(morphTimer);
      const len = target.length;
      const totalFrames = 22;
      let frame = 0;

      morphTimer = setInterval(() => {
        frame++;
        const progress = frame / totalFrames;
        let out = '';

        for (let i = 0; i < len; i++) {
          const ch = target[i];
          if (ch === '\n' || ch === ' ') { out += ch; continue; }

          const charProgress = i / len;
          const noise = Math.random() * 0.15;

          if (progress >= charProgress + noise) {
            out += ch;
          } else if (/[█▄▀▌▐▒░▓╗╔╝╚║═╠╣╦╩╬]/.test(ch)) {
            out += blockPool[Math.floor(Math.random() * blockPool.length)];
          } else {
            out += charset[Math.floor(Math.random() * charset.length)];
          }
        }

        morphEl.textContent = out;
        if (frame >= totalFrames) {
          clearInterval(morphTimer);
          morphEl.textContent = target;
        }
      }, 40);
    }

    // ====================== Floating particles ======================
    function spawnParticle() {
      const p = document.createElement('div');
      p.className = 'particle';
      p.style.left = Math.random() * 100 + 'vw';
      p.style.animationDuration = (8 + Math.random() * 12) + 's';
      p.style.opacity = String(0.2 + Math.random() * 0.4);
      document.body.appendChild(p);
      setTimeout(() => p.remove(), 22000);
    }

    setInterval(spawnParticle, 800);
    for (let i = 0; i < 6; i++) setTimeout(spawnParticle, i * 400);

    // ====================== Initial render ======================
    morphTo(ascii.home);
    bodyEl.innerHTML = bodies.home;
    startHomeCycle();

    // ====================== Keyboard navigation ======================
    document.addEventListener('keydown', (e) => {
      const idx = sections.indexOf(current);
      if (e.key === 'ArrowRight' || e.key === 'ArrowDown') {
        switchTo(sections[(idx + 1) % sections.length]);
      } else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') {
        switchTo(sections[(idx - 1 + sections.length) % sections.length]);
      }
    });
  </script>
</body>
</html>
