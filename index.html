    :root {

      --accent-glow: rgba(230, 200, 117, 0.15);
      --bg: #0a0907;
      --text: #b5ad9c;
      --dim: #5a5448;
      --border: rgba(230, 200, 117, 0.1);
    }

    html, body { height: 100%; overflow: hidden; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'JetBrains Mono', 'Fira Code', 'SF Mono', 'Menlo', 'Consolas', 'Courier New', monospace;
      font-size: 14px;
      line-height: 1.5;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
    }

    /* ambient + particle layers (unchanged aesthetic) */
    .ambient-container {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
    }

    .ambient-container::before {
      content: '';
      position: absolute;
      inset: 0;
      background:
        radial-gradient(ellipse at 50% 40%, var(--accent-glow) 0%, transparent 60%),
        radial-gradient(ellipse at 15% 85%, rgba(230, 200, 117, 0.04) 0%, transparent 50%),
        radial-gradient(ellipse at 85% 15%, rgba(230, 200, 117, 0.03) 0%, transparent 40%);
    }

    .ambient-container::after {
      content: '';
      position: absolute;
      inset: 0;
      background-image: repeating-linear-gradient(
        0deg,
        transparent 0,
        transparent 2px,
        rgba(230, 200, 117, 0.02) 2px,
        rgba(230, 200, 117, 0.02) 3px
      );
      opacity: 0.7;
      animation: scanlines 12s linear infinite;
    }

    @keyframes scanlines {
      0% { transform: translateY(0); }
      100% { transform: translateY(3px); }
    }

    body::before {
      content: '';
      position: fixed;
      inset: 0;
      box-shadow: inset 0 0 220px rgba(0, 0, 0, 0.85);
      pointer-events: none;
      z-index: 1;
    }

    .particle {
      position: fixed;
      width: 2px;
      height: 2px;
      background: var(--accent);
      border-radius: 50%;
      pointer-events: none;
      z-index: 1;
      box-shadow: 0 0 4px var(--accent);
      animation: drift linear infinite;
    }

    @keyframes drift {
      from { transform: translateY(100vh) translateX(0); opacity: 0; }
      10% { opacity: 0.4; }
      90% { opacity: 0.4; }
      to { transform: translateY(-10vh) translateX(20px); opacity: 0; }
    }

    /* navigation */
    .controls {
      position: fixed;
      top: 2rem;
      left: 50%;
      transform: translateX(-50%);
      z-index: 10;
    }

    #nav-buttons {
      display: flex;
      gap: 0.4rem;
      flex-wrap: wrap;
      justify-content: center;
      align-items: center;
    }

    .nav-btn {
      background: none;
      border: none;
      color: var(--dim);
      font-family: inherit;
      font-size: 0.8rem;
      cursor: pointer;
      padding: 0.4rem 0.6rem;
      letter-spacing: 0.05em;
      transition: color 0.25s ease, text-shadow 0.25s ease;
    }

    .nav-btn:hover { color: var(--text); }

    .nav-btn.active {
      color: var(--accent);
      text-shadow: 0 0 8px var(--accent-glow);
    }

    .nav-btn::before { content: '['; opacity: 0.5; margin-right: 0.3rem; }
    .nav-btn::after  { content: ']'; opacity: 0.5; margin-left: 0.3rem; }

    /* main content */
    main {
      position: relative;
      z-index: 5;
      padding: 5rem 1.5rem 4rem;
      max-width: 760px;
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1.8rem;
    }

    .morph-section {
      color: var(--accent);
      font-size: 0.75rem;
      line-height: 1.2;
      white-space: pre;
      text-align: center;
      filter: drop-shadow(0 0 12px rgba(230, 200, 117, 0.25));
      letter-spacing: 0.02em;
      min-height: 110px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .body-section {
      width: 100%;
      max-width: 600px;
      text-align: center;
      transition: opacity 0.35s ease, transform 0.35s ease;
      max-height: 55vh;
      overflow-y: auto;
      padding-right: 0.4rem;
    }

    .body-section::-webkit-scrollbar { width: 3px; }
    .body-section::-webkit-scrollbar-track { background: transparent; }
    .body-section::-webkit-scrollbar-thumb {
      background: var(--border);
      border-radius: 2px;
    }
    .body-section::-webkit-scrollbar-thumb:hover {
      background: var(--accent-soft);
    }

    .body-section.fading {
      opacity: 0;
      transform: translateY(8px);
    }

    .tagline {
      color: var(--dim);
      font-size: 0.85rem;
      letter-spacing: 0.1em;
      margin-bottom: 1.2rem;
    }

    .tagline span { color: var(--accent); }

    .cmd-label {

      margin-bottom: 1rem;
      text-align: left;
      letter-spacing: 0.02em;

    .skill-key {

    .links-list {

      transform: translateX(-50%);
      color: var(--dim);
      font-size: 0.7rem;
      letter-spacing: 0.1em;

    .pulse {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--accent);
      box-shadow: 0 0 6px var(--accent);
      animation: pulse 2s ease-in-out infinite;
      margin-left: 0.3rem;
    }
    @keyframes pulse {
      0%, 100% { opacity: 0.4; transform: scale(1); }
      50% { opacity: 1; transform: scale(1.3); }
    }

    .audio-toggle {
      position: fixed;
      bottom: 1rem;
      right: 1.5rem;
      background: none;
      border: 1px solid var(--border);
      color: var(--dim);
      font-family: inherit;
      font-size: 0.72rem;
      letter-spacing: 0.1em;
      padding: 0.4rem 0.7rem;

      z-index: 10;
      display: flex;
      align-items: center;
      gap: 0.5rem;
      transition: color 0.25s ease, border-color 0.25s ease;

    .audio-toggle:hover {
      color: var(--text);
      border-color: var(--accent-soft);
    }
    .audio-toggle.playing {
      color: var(--accent);
      border-color: var(--accent-soft);
    }
    .audio-icon {
      font-size: 0.9rem;
      line-height: 1;
    }
    @keyframes note-pulse {
      0%, 100% { opacity: 0.6; }
      50% { opacity: 1; }
    }
    .audio-toggle.playing .audio-icon {
      animation: note-pulse 1.6s ease-in-out infinite;
    }

    @media (max-width: 600px) {
      .morph-section { font-size: 0.5rem; }
      main { padding: 5rem 1rem 4rem; }
      .skill-row { grid-template-columns: 120px auto; gap: 0.7rem; }
      .nav-btn { font-size: 0.7rem; padding: 0.3rem 0.4rem; }
    }
  </style>
</head>

  let morphTimer = null;
  let homeCycleTimer = null;

  sections.forEach(name => {

    btn.className = 'nav-btn' + (name === 'home' ? ' active' : '');
    btn.textContent = name;
    btn.dataset.section = name;
    btn.addEventListener('click', () => switchTo(name));
    navContainer.appendChild(btn);
  });

  function switchTo(name) {
    if (name === current) return;
    current = name;
    document.querySelectorAll('.nav-btn').forEach(b => {
      b.classList.toggle('active', b.dataset.section === name);
    });
    bodyEl.classList.add('fading');
    setTimeout(() => {
      morphTo(ascii[name]);
      bodyEl.innerHTML = bodies[name];
      bodyEl.classList.remove('fading');
      if (name === 'home') startHomeCycle();
      else stopHomeCycle();
    }, 320);
  }

  function startHomeCycle() {
    stopHomeCycle();
    let homeIdx = 0;
    const variants = ['home', 'gaffy'];
    homeCycleTimer = setInterval(() => {
      homeIdx = (homeIdx + 1) % variants.length;
      morphTo(ascii[variants[homeIdx]]);

  }

  function stopHomeCycle() {
    if (homeCycleTimer) clearInterval(homeCycleTimer);
    homeCycleTimer = null;
  }

  // morph animation effect
  const charset = 'abcdefghijklmnopqrstuvwxyz0123456789!@#$%^&*<>?/\\|~+=';
  const blockPool = '█▄▀▌▐▒░▓';
  function morphTo(target) {
    clearInterval(morphTimer);
    const len = target.length;
    let frame = 0;
    const totalFrames = 22;
    morphTimer = setInterval(() => {
      frame++;
      const progress = frame / totalFrames;
      let out = '';
      for (let i = 0; i < len; i++) {
        const ch = target[i];
        if (ch === '\n' || ch === ' ') { out += ch; continue; }
        const charProgress = i / len;
        const noise = Math.random() * 0.15;
        if (progress >= charProgress + noise) { out += ch; }
        else if (/[█▄▀▌▐▒░▓╗╔╝╚║═╠╣╦╩╬]/.test(ch)) { out += blockPool[Math.floor(Math.random() * blockPool.length)]; }
        else { out += charset[Math.floor(Math.random() * charset.length)]; }
      }
      morphEl.textContent = out;
      if (frame >= totalFrames) {
        clearInterval(morphTimer);
        morphEl.textContent = target;
      }
    }, 40);
  }

  // particles
  function spawnParticle() {
    const p = document.createElement('div');
    p.className = 'particle';
    p.style.left = Math.random() * 100 + 'vw';
    p.style.animationDuration = (8 + Math.random() * 12) + 's';
    p.style.opacity = String(0.2 + Math.random() * 0.4);
    document.body.appendChild(p);
    setTimeout(() => p.remove(), 22000);
  }
  setInterval(spawnParticle, 800);
  for (let i = 0; i < 6; i++) setTimeout(spawnParticle, i * 400);

  // initial render
  morphTo(ascii.home);
  bodyEl.innerHTML = bodies.home;
  startHomeCycle();

  // keyboard navigation
  document.addEventListener('keydown', (e) => {
    const idx = sections.indexOf(current);
    if (e.key === 'ArrowRight' || e.key === 'ArrowDown') switchTo(sections[(idx + 1) % sections.length]);
    else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') switchTo(sections[(idx - 1 + sections.length) % sections.length]);
  });

  // background music (low volume, ambient)
  const audio = document.getElementById('bg-music');
  const audioToggle = document.getElementById('audio-toggle');
  const audioStateSpan = audioToggle.querySelector('.audio-state');
  const audioIconSpan = audioToggle.querySelector('.audio-icon');
  const TARGET_VOL = 0.15;
  audio.volume = 0;

  function updateAudioUI() {
    const playing = !audio.paused;
    audioToggle.classList.toggle('playing', playing);
    audioStateSpan.textContent = playing ? 'on' : 'off';
    audioIconSpan.textContent = playing ? '♫' : '♪';
  }

  function fadeVolumeTo(target) {
    clearInterval(audio._fadeTimer);
    audio._fadeTimer = setInterval(() => {
      const step = audio.volume < target ? 0.015 : -0.03;
      const next = audio.volume + step;
      if ((step > 0 && next >= target) || (step < 0 && next <= target)) {
        audio.volume = target;
        clearInterval(audio._fadeTimer);
        if (target === 0) audio.pause();
        updateAudioUI();
      } else {
        audio.volume = Math.max(0, Math.min(1, next));
      }
    }, 50);
  }

  async function playMusic() {
    try {
      await audio.play();
      fadeVolumeTo(TARGET_VOL);
    } catch (err) { updateAudioUI(); }
  }
  function pauseMusic() {
    fadeVolumeTo(0);
    audioToggle.classList.remove('playing');
    audioStateSpan.textContent = 'off';
    audioIconSpan.textContent = '♪';
  }
  audioToggle.addEventListener('click', (e) => {
    e.stopPropagation();
    if (audio.paused) playMusic();
    else pauseMusic();
  });
  window.addEventListener('load', async () => {
    try {
      await audio.play();
      fadeVolumeTo(TARGET_VOL);
    } catch {
      const init = () => {
        if (audio.paused) playMusic();
        document.removeEventListener('click', init);
        document.removeEventListener('keydown', init);
      };
      document.addEventListener('click', init);
      document.addEventListener('keydown', init);
      updateAudioUI();
    }
  });
</script>
</body>
</html>
